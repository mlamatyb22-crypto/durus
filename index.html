<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خلاصة المعارف العقائدية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1e7; --panel:#fffdf8; --ink:#2b2418; --muted:#7a6e5c; --line:#e6dccb;
  --accent:#1f6f5c; --accent-2:#b8892b; --hl:rgba(184,137,43,.28); --hl-edge:#b8892b;
  --shadow:0 1px 2px rgba(60,40,10,.06),0 8px 24px rgba(60,40,10,.08);
  --ui:"Noto Kufi Arabic","Geeza Pro",system-ui,sans-serif; --serif:"Amiri","Geeza Pro",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17140f; --panel:#211d16; --ink:#efe6d6; --muted:#a89a83; --line:#3a3227;
  --accent:#4fb39a; --accent-2:#d9a845; --hl:rgba(217,168,69,.30);
}}
:root[data-theme="dark"]{--bg:#17140f; --panel:#211d16; --ink:#efe6d6; --muted:#a89a83; --line:#3a3227; --accent:#4fb39a; --accent-2:#d9a845; --hl:rgba(217,168,69,.30);}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;display:grid;grid-template-columns:340px 1fr;grid-template-rows:56px 1fr auto;grid-template-areas:"top top" "side main" "player player";height:100vh;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
header{grid-area:top;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-family:var(--serif);font-size:22px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sp{flex:1}
.ib{border:1px solid var(--line);background:transparent;border-radius:10px;height:36px;min-width:36px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ib:hover{background:var(--bg)}
.ib.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#menuBtn{display:none}
aside{grid-area:side;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:12px 4px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.pane{overflow:auto;flex:1;padding:8px}
.pane[hidden]{display:none}
.lesson{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.lesson:hover{background:var(--bg)}
.lesson.cur{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.lesson .num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-weight:700;flex:none;font-size:13px}
.lesson.done .num{background:var(--accent);color:#fff}
.lesson .meta{flex:1;min-width:0}
.lesson .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson .s{color:var(--muted);font-size:12px}
.toc a{display:block;padding:7px 10px;border-radius:8px;color:inherit;text-decoration:none;font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
.toc a:hover{background:var(--bg)}
.toc a.l0{font-weight:700;color:var(--accent);margin-top:8px}
.toc a.l1{padding-right:22px}
.toc a span{color:var(--muted);font-variant-numeric:tabular-nums}
#q{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.hit{padding:10px;border-radius:10px;cursor:pointer;font-family:var(--serif);font-size:16px;line-height:1.7}
.hit:hover{background:var(--bg)}
.hit b{font-family:var(--ui);font-size:12px;color:var(--accent);display:block}
main{grid-area:main;overflow:auto;position:relative;scroll-behavior:smooth}
.stage{max-width:820px;margin:0 auto;padding:20px 16px 40px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar .pg{font-weight:700;font-variant-numeric:tabular-nums}
.bar .chip{font-size:12px;background:var(--panel);border:1px solid var(--line);padding:4px 10px;border-radius:999px;color:var(--muted)}
.page{position:relative;background:#fff;border-radius:6px;box-shadow:var(--shadow);overflow:hidden;user-select:none}
.page img{display:block;width:100%;height:auto}
:root[data-theme="dark"] .page img,@media (prefers-color-scheme:dark){}
.page .ln{position:absolute;border-radius:4px;cursor:pointer}
.page .ln:hover{background:rgba(31,111,92,.10)}
.page .ln.timed:hover{outline:1px dashed var(--accent)}
.page .ln.now{background:var(--hl);box-shadow:inset 0 -2px 0 var(--hl-edge);transition:background .3s}
.nav{display:flex;justify-content:space-between;margin-top:14px;gap:8px}
.nav .ib{height:42px;padding:0 18px}
.review{margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.review h2{font-family:var(--serif);margin:0 0 4px;font-size:26px}
.review .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.review h3{font-size:15px;color:var(--accent);margin:20px 0 8px}
.refs{display:flex;flex-wrap:wrap;gap:6px}
.refs button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:13px}
.refs button:hover{border-color:var(--accent);color:var(--accent)}
.pts{margin:0;padding-right:20px;line-height:1.9;font-family:var(--serif);font-size:17px}
.diagram{overflow:auto;padding:8px 0}
.tree{display:flex;flex-direction:column;align-items:center;gap:0;min-width:max-content;padding:4px}
.node{background:var(--bg);border:1.5px solid var(--accent);border-radius:12px;padding:8px 14px;font-family:var(--serif);font-size:16px;text-align:center;max-width:240px;line-height:1.5}
.node.root{background:var(--accent);color:#fff;font-weight:700}
.node small{display:block;font-family:var(--ui);font-size:11.5px;color:var(--muted);margin-top:2px}
.node.root small{color:#e7f3ef}
.kids{display:flex;gap:14px;position:relative;padding-top:22px;justify-content:center}
.kids::before{content:"";position:absolute;top:0;left:50%;width:1.5px;height:11px;background:var(--accent)}
.kid{display:flex;flex-direction:column;align-items:center;position:relative;padding-top:11px}
.kid::before{content:"";position:absolute;top:0;height:1.5px;background:var(--accent);left:0;right:0}
.kid:first-child::before{right:50%}.kid:last-child::before{left:50%}
.kid:only-child::before{display:none}
.kid::after{content:"";position:absolute;top:0;left:50%;width:1.5px;height:11px;background:var(--accent)}
.flow{display:flex;flex-direction:column;align-items:center;gap:0}
.flow .arrow{color:var(--accent);font-size:18px;line-height:1.2}
.fig{margin:0;background:var(--bg);border-radius:12px;padding:12px;text-align:center}
.fig svg{width:100%;max-width:560px;height:auto;font-family:var(--ui)}
.fig figcaption{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.7}
.fig .tx{fill:var(--ink)} .fig .mu{fill:var(--muted)} .fig .ac{fill:var(--accent)} .fig .ac2{fill:var(--accent-2)}
.fig .st{stroke:var(--ink);fill:none;stroke-width:2} .fig .sa{stroke:var(--accent);fill:none;stroke-width:2}
.q{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.q p{margin:0 0 10px;font-weight:600;line-height:1.7}
.q label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;cursor:pointer;line-height:1.6}
.q label:hover{background:var(--bg)}
.q input{margin-top:6px;accent-color:var(--accent)}
.q.ans label.right{background:color-mix(in srgb,#2e9b6a 16%,transparent)}
.q.ans label.wrong{background:color-mix(in srgb,#c0503a 16%,transparent)}
.q .why{display:none;font-size:13px;color:var(--muted);margin-top:6px;line-height:1.7}
.q.ans .why{display:block}
.score{font-weight:700;margin-top:8px}
.note{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);margin-top:18px;padding-top:10px}
.donebtn{margin-top:14px}
footer{grid-area:player;background:var(--panel);border-top:1px solid var(--line);padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
footer .ttl{font-weight:700;min-width:90px}
.play{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;border:0;display:grid;place-items:center}
.seek{flex:1;display:flex;align-items:center;gap:8px;min-width:200px}
.seek input{flex:1;accent-color:var(--accent)}
.tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:44px;text-align:center}
.marks{position:relative;height:6px;margin:0 52px -4px}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.play svg.ic{fill:currentColor;stroke:none;width:22px;height:22px}
@media (max-width:900px){
  body{grid-template-columns:1fr;grid-template-areas:"top" "main" "player"}
  aside{position:fixed;inset:56px 0 auto auto;width:min(340px,90vw);bottom:0;z-index:20;transform:translateX(100%);transition:transform .2s;box-shadow:var(--shadow)}
  aside.open{transform:none}
  #menuBtn{display:inline-flex}
  header h1{font-size:18px}
  .hide-sm{display:none}
  footer{gap:6px;padding:8px}
}
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:16px}
#gate form{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 24px;width:min(360px,100%);text-align:center;box-shadow:var(--shadow)}
#gate h2{font-family:var(--serif);font-size:26px;margin:0 0 6px}
#gate p{color:var(--muted);margin:0 0 18px;font-size:14px}
#gate input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;text-align:center;font-size:17px}
#gate button{margin-top:12px;width:100%;height:46px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700}
#gate .err{color:#c0503a;font-size:13px;min-height:20px;margin-top:8px}
body.locked>*:not(#gate){visibility:hidden}
</style>
</head>
<body class="locked">
<div id="gate"><form id="gateForm" autocomplete="off">
  <h2>خلاصة المعارف العقائدية</h2>
  <p>أدخل كلمة المرور للدخول إلى الكتاب</p>
  <input id="pw" type="password" placeholder="كلمة المرور" autofocus>
  <button type="submit">دخول</button>
  <div class="err" id="pwErr"></div>
</form></div>
<script>
(() => {
  const H = "62e9daeed00c76fa33f7953f7b2722958dddf83a55c9799eee7a0b161effc33a";
  const open = () => { document.body.classList.remove("locked"); document.getElementById("gate").remove(); };
  try { if (localStorage.getItem("km:gate") === H) { open(); return; } } catch (e) {}
  document.getElementById("gateForm").onsubmit = async e => {
    e.preventDefault();
    const v = document.getElementById("pw").value.trim().replace(/ى/g, "ي");
    const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v));
    const h = [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, "0")).join("");
    if (h === H) { try { localStorage.setItem("km:gate", H); } catch (e) {} open(); }
    else document.getElementById("pwErr").textContent = "كلمة المرور غير صحيحة";
  };
})();
</script>
<header>
  <button class="ib" id="menuBtn" aria-label="القائمة"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <h1>خلاصة المعارف العقائدية</h1>
  <span class="sp"></span>
  <button class="ib on" id="followBtn" title="قلب الصفحات تلقائياً مع الصوت"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg><span class="hide-sm">متابعة الصوت</span></button>
  <button class="ib" id="themeBtn" title="الوضع الليلي"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</header>

<aside id="side">
  <div class="tabs">
    <button class="on" data-t="lessons">الدروس</button>
    <button data-t="toc">الفهرس</button>
    <button data-t="search">بحث</button>
  </div>
  <div class="pane" id="lessons"></div>
  <div class="pane toc" id="toc" hidden></div>
  <div class="pane" id="search" hidden>
    <input id="q" placeholder="ابحث في نص الكتاب…" autocomplete="off">
    <div id="hits"></div>
  </div>
</aside>

<main id="main">
  <div class="stage">
    <div class="bar">
      <span class="pg" id="pgLabel"></span>
      <span class="chip" id="secLabel"></span>
      <span class="chip" id="lesLabel"></span>
    </div>
    <div class="page" id="page"><img id="img" alt=""></div>
    <div class="nav">
      <button class="ib" id="prev">→ الصفحة السابقة</button>
      <button class="ib" id="next">الصفحة التالية ←</button>
    </div>
    <section class="review" id="review" hidden></section>
  </div>
</main>

<footer>
  <span class="ttl" id="aTitle">الدرس ١</span>
  <button class="ib" id="back15" title="رجوع ١٥ ثانية"><svg class="ic" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg></button>
  <button class="play" id="playBtn" aria-label="تشغيل"><svg class="ic" viewBox="0 0 24 24" id="playIc"><path d="M8 5v14l11-7z"/></svg></button>
  <button class="ib" id="fwd15" title="تقديم ١٥ ثانية"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8m0-5v5h-5"/></svg></button>
  <div class="seek"><span class="tm" id="tCur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span class="tm" id="tDur">0:00</span></div>
  <button class="ib" id="rate" title="سرعة التشغيل">1×</button>
  <audio id="audio" preload="metadata"></audio>
</footer>

<script src="data.js?v=1793644527"></script>
<script>window.R = {};</script><script src="review.js?v=1793644527"></script>
<script>
const $ = s => document.querySelector(s);
const AR = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const fmt = s => { s = Math.max(0, s|0); const h = s/3600|0, m = (s%3600)/60|0, x = s%60; return (h ? h+":"+String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); };
const store = { get(k, d){ try { const v = localStorage.getItem("km:"+k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
                set(k, v){ try { localStorage.setItem("km:"+k, JSON.stringify(v)); } catch(e){} } };
const D = window.BOOK, R = window.R;
const LES = D.lessons;                 // [{n, from, to, dur, pages:[[p,t]], lines:[[lineId,t]]}]
const LINES = D.lines;                 // [{p, b:[x,y,w,h]}]
const audio = $("#audio");
let page = store.get("page", LES[0].from), cur = store.get("lesson", 1), follow = true, rates = [1, 1.25, 1.5, 1.75, 2, .75], ri = 0;
const done = new Set(store.get("done", []));
const bookNo = p => p - 1;            // printed page number = PDF page - 1
const lessonOf = p => { const c = LES.find(l => l.n === cur); return c && p >= c.from && p <= c.to ? c : LES.find(l => p >= l.from && p <= l.to); };
const sectionOf = p => { let s = ""; for (const t of D.toc) if (t.p <= p) s = t.t; return s; };

// ---------- sidebar ----------
function lessonTitle(l){
  const secs = (window.SECS || []).filter(x => x.title);
  const inside = secs.filter(x => x.p >= l.from && x.p <= l.to).map(x => x.title);
  if (inside.length) return inside.slice(0, 2).join(" · ");
  const before = secs.filter(x => x.p < l.from).pop();
  return before ? before.title + " (تتمة)" : sectionOf(l.from);
}
function renderLessons(){
  $("#lessons").innerHTML = LES.map(l => `
    <div class="lesson ${l.n===cur?"cur":""} ${done.has(l.n)?"done":""}" data-n="${l.n}">
      <div class="num">${AR(l.n)}</div>
      <div class="meta"><div class="t">${lessonTitle(l)}</div>
      <div class="s">ص ${AR(bookNo(l.from))}–${AR(bookNo(l.to))} · ${fmt(l.dur)}</div></div>
    </div>`).join("");
}
$("#lessons").onclick = e => { const el = e.target.closest(".lesson"); if (el) { loadLesson(+el.dataset.n, true); closeSide(); } };
$("#toc").innerHTML = D.toc.map(t => `<a href="#" class="l${t.l}" data-p="${t.p}">${t.t}<span>${AR(bookNo(t.p))}</span></a>`).join("");
$("#toc").onclick = e => { const a = e.target.closest("a"); if (a) { e.preventDefault(); show(+a.dataset.p); closeSide(); } };
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  ["lessons","toc","search"].forEach(id => $("#"+id).hidden = id !== b.dataset.t);
});
const norm = s => s.replace(/[ؐ-ًؚ-ٰٟـ]/g,"").replace(/[إأآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه");
$("#q").oninput = () => {
  const q = norm($("#q").value.trim()); if (q.length < 2) { $("#hits").innerHTML = ""; return; }
  const out = [];
  for (const [p, txt] of Object.entries(D.text)) {
    const i = norm(txt).indexOf(q);
    if (i >= 0) out.push(`<div class="hit" data-p="${p}"><b>صفحة ${AR(bookNo(+p))} · ${sectionOf(+p)}</b>…${txt.slice(Math.max(0,i-40), i+q.length+60)}…</div>`);
    if (out.length > 60) break;
  }
  $("#hits").innerHTML = out.join("") || `<p style="color:var(--muted);padding:10px">لا توجد نتائج</p>`;
};
$("#hits").onclick = e => { const h = e.target.closest(".hit"); if (h) { show(+h.dataset.p); closeSide(); } };
const closeSide = () => $("#side").classList.remove("open");
$("#menuBtn").onclick = () => $("#side").classList.toggle("open");

// ---------- page view ----------
function show(p, keepFollow){
  p = Math.max(1, Math.min(D.pageCount, p)); page = p; store.set("page", p);
  $("#img").src = `pages/p${String(p).padStart(3,"0")}.jpg`;
  $("#pgLabel").textContent = "صفحة " + AR(bookNo(p));
  $("#secLabel").textContent = sectionOf(p) || "—";
  const l = lessonOf(p); $("#lesLabel").textContent = l ? "الدرس " + AR(l.n) : "";
  const box = $("#page"); box.querySelectorAll(".ln").forEach(x => x.remove());
  const lt = lineTimes(cur);
  LINES.forEach((ln, id) => {
    if (ln.p !== p) return;
    const d = document.createElement("div"); d.className = "ln" + (lt.has(id) ? " timed" : ""); d.dataset.id = id;
    Object.assign(d.style, { left: (ln.b[0]*100-1)+"%", top: (ln.b[1]*100-.4)+"%", width: (ln.b[2]*100+2)+"%", height: (ln.b[3]*100+.8)+"%" });
    if (lt.has(id)) d.title = "تشغيل من هنا (" + fmt(lt.get(id)) + ")";
    box.appendChild(d);
  });
  renderReview();
  if (!keepFollow) $("#main").scrollTop = 0;
}
$("#page").onclick = e => {
  const d = e.target.closest(".ln"); if (!d) return;
  const t = lineTimes(cur).get(+d.dataset.id);
  if (t != null) { audio.currentTime = t; audio.play(); setFollow(true); }
  else { const l = lessonOf(page); if (l) { const t2 = estimate(l, +d.dataset.id); if (t2 != null) { if (l.n !== cur) loadLesson(l.n); audio.currentTime = t2; audio.play(); setFollow(true); } } }
};
$("#prev").onclick = () => { setFollow(false); show(page - 1); };
$("#next").onclick = () => { setFollow(false); show(page + 1); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft") { setFollow(false); show(page + 1); }
  if (e.key === "ArrowRight") { setFollow(false); show(page - 1); }
  if (e.key === " ") { e.preventDefault(); toggle(); }
});

// ---------- audio sync ----------
const ltCache = {};
function lineTimes(n){
  if (ltCache[n]) return ltCache[n];
  const m = new Map(); const l = LES.find(x => x.n === n); if (l) l.lines.forEach(([id, t]) => m.set(id, t));
  return ltCache[n] = m;
}
function estimate(l, id){ // nearest timed line before this one in the same lesson
  let best = null; for (const [lid, t] of l.lines) if (lid <= id) best = t; return best ?? (l.pages[0] ? l.pages[0][1] : 0);
}
function loadLesson(n, autoplay){
  const l = LES.find(x => x.n === n); if (!l) return;
  if (cur !== n || !audio.src) { cur = n; audio.src = `audio/${String(n).padStart(2,"0")}.m4a`; }
  store.set("lesson", n); $("#aTitle").textContent = "الدرس " + AR(n);
  renderLessons(); setFollow(true); show(l.from);
  if (autoplay) audio.play();
}
function setFollow(v){ follow = v; $("#followBtn").classList.toggle("on", v); }
$("#followBtn").onclick = () => { setFollow(!follow); if (follow) sync(true); };
let lastLine = -1;
function sync(force){
  const l = LES.find(x => x.n === cur); if (!l) return;
  const t = audio.currentTime;
  let pg = l.from; for (const [p, pt] of l.pages) if (pt <= t + .5) pg = p;
  let line = -1; for (const [id, lt] of l.lines) { if (lt <= t + .3) line = id; else break; }
  if (follow && (pg !== page || force)) show(pg, true);
  if (line !== lastLine || force) {
    lastLine = line;
    document.querySelectorAll(".ln.now").forEach(x => x.classList.remove("now"));
    const el = document.querySelector(`.ln[data-id="${line}"]`);
    if (el) { el.classList.add("now"); if (follow) el.scrollIntoView({ block: "center", behavior: "smooth" }); }
  }
}
const toggle = () => audio.paused ? audio.play() : audio.pause();
$("#playBtn").onclick = toggle;
audio.onplay = () => $("#playIc").innerHTML = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
audio.onpause = () => { $("#playIc").innerHTML = '<path d="M8 5v14l11-7z"/>'; store.set("pos", [cur, audio.currentTime]); };
audio.ontimeupdate = () => {
  $("#tCur").textContent = fmt(audio.currentTime);
  if (audio.duration) $("#seek").value = audio.currentTime / audio.duration * 1000;
  sync();
};
audio.onloadedmetadata = () => $("#tDur").textContent = fmt(audio.duration);
audio.onended = () => { done.add(cur); store.set("done", [...done]); renderLessons(); const l = LES.find(x => x.n === cur); show(l.to); document.getElementById("review").scrollIntoView({ behavior: "smooth" }); };
$("#seek").oninput = e => { if (audio.duration) audio.currentTime = e.target.value / 1000 * audio.duration; };
$("#back15").onclick = () => audio.currentTime -= 15;
$("#fwd15").onclick = () => audio.currentTime += 15;
$("#rate").onclick = () => { ri = (ri + 1) % rates.length; audio.playbackRate = rates[ri]; $("#rate").textContent = String(rates[ri]).replace(".", "٫") + "×"; };
$("#themeBtn").onclick = () => { const r = document.documentElement; const d = r.dataset.theme === "dark" || (!r.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches); r.dataset.theme = d ? "light" : "dark"; store.set("theme", r.dataset.theme); };
if (store.get("theme")) document.documentElement.dataset.theme = store.get("theme");

// ---------- review after each lesson ----------
function tree(n, root){
  const kids = n.c && n.c.length ? `<div class="kids">${n.c.map(k => `<div class="kid">${tree(k)}</div>`).join("")}</div>` : "";
  return `<div class="tree"><div class="node ${root?"root":""}">${n.t}${n.s?`<small>${n.s}</small>`:""}</div>${kids}</div>`;
}
function flow(steps){ return `<div class="flow">${steps.map((s,i) => (i?'<div class="arrow">↓</div>':"") + `<div class="node ${i==0?"root":""}">${s}</div>`).join("")}</div>`; }
function renderReview(){
  const l = lessonOf(page), box = $("#review");
  if (!l || page !== l.to) { box.hidden = true; return; }
  const secs = (window.SECS || []).filter(x => x.p >= l.from && x.p <= l.to);
  const r = Object.assign({ points: [], qs: [], figs: [], trees: [] }, R[l.n] || {});
  secs.forEach(x => { r.points.push(...(x.points || [])); r.qs.push(...(x.qs || [])); r.figs.push(...(x.figs || []));
    if (x.tree) r.trees.push({ t: x.treeTitle || "مخطط توضيحي", tree: x.tree }); if (x.flow) r.trees.push({ t: x.flowTitle || "تسلسل الاستدلال", flow: x.flow }); });
  if (!r.points.length) delete r.points; if (!r.qs.length) delete r.qs;
  const refs = D.toc.filter(t => t.p >= l.from && t.p <= l.to);
  box.hidden = false;
  box.innerHTML = `
    <h2>مراجعة الدرس ${AR(l.n)}</h2>
    <div class="sub">من صفحة ${AR(bookNo(l.from))} إلى صفحة ${AR(bookNo(l.to))} · مدة الدرس ${fmt(l.dur)}</div>
    <h3>مرجع الصفحات</h3>
    <div class="refs">${(refs.length ? refs : [{t: sectionOf(l.from), p: l.from}]).map(t => `<button data-p="${t.p}">${t.t} · ص ${AR(bookNo(t.p))}</button>`).join("")}</div>
    ${r.points ? `<h3>أهم ما في الدرس</h3><ul class="pts">${r.points.map(p => `<li>${p}</li>`).join("")}</ul>` : ""}
    ${r.trees.map(x => `<h3>${x.t}</h3><div class="diagram">${x.tree ? tree(x.tree, true) : flow(x.flow)}</div>`).join("")}
    ${(r.figs || []).map(f => `<h3>${f.title}</h3><figure class="fig">${f.svg}<figcaption>${f.cap || ""}</figcaption></figure>`).join("")}
    ${r.qs ? `<h3>اختبر نفسك</h3>${r.qs.map((q, i) => `
      <div class="q" data-a="${q.a}"><p>${AR(i+1)}. ${q.q}</p>
      ${q.o.map((o, j) => `<label><input type="radio" name="q${l.n}_${i}" value="${j}">${o}</label>`).join("")}
      <div class="why">${q.w || ""}</div></div>`).join("")}<div class="score" id="score"></div>` : ""}
    <button class="ib donebtn ${done.has(l.n)?"on":""}" id="doneBtn">${done.has(l.n) ? "✓ تمت مراجعة الدرس" : "تحديد الدرس كمكتمل"}</button>
    ${l.n < LES.length ? `<button class="ib donebtn" id="nextLes">الدرس التالي ←</button>` : ""}
    <div class="note">ملاحظة: النقاط والمخططات والأسئلة إضافات مساعدة للمراجعة، ونصّ الكتاب في الصفحات محفوظ كما هو دون أي تغيير.</div>`;
  box.querySelectorAll(".refs button").forEach(b => b.onclick = () => { setFollow(false); show(+b.dataset.p); });
  box.querySelectorAll(".q").forEach(q => q.onchange = e => {
    q.classList.add("ans"); const a = +q.dataset.a;
    q.querySelectorAll("label").forEach((lb, j) => { lb.classList.toggle("right", j === a); lb.classList.toggle("wrong", j !== a && lb.querySelector("input").checked); });
    const qs = [...box.querySelectorAll(".q")], answered = qs.filter(x => x.classList.contains("ans"));
    const ok = answered.filter(x => x.querySelector("input:checked") && +x.querySelector("input:checked").value === +x.dataset.a).length;
    $("#score").textContent = `النتيجة: ${AR(ok)} من ${AR(qs.length)}`;
  });
  $("#doneBtn").onclick = () => { done.has(l.n) ? done.delete(l.n) : done.add(l.n); store.set("done", [...done]); renderLessons(); renderReview(); };
  const nx = $("#nextLes"); if (nx) nx.onclick = () => loadLesson(l.n + 1, true);
}

// ---------- start ----------
const pos = store.get("pos", null);
loadLesson(cur);
if (pos && pos[0] === cur) audio.addEventListener("loadedmetadata", () => { audio.currentTime = pos[1]; sync(true); }, { once: true });
</script>
</body>
</html>
